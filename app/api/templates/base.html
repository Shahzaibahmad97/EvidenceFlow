<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}EvidenceFlow{% endblock %}</title>
<style>
  :root { --ink:#1b1f24; --muted:#5b6670; --line:#d8dee4; --bg:#fbfcfd;
          --pass:#1a7f47; --review:#9a6700; --fail:#b3261e; --mark:#fff2b2; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { border-bottom:1px solid var(--line); background:#fff; padding:14px 24px; }
  header a { color:inherit; text-decoration:none; font-weight:600; letter-spacing:-.01em; }
  header span { color:var(--muted); font-weight:400; margin-left:10px; font-size:13px; }
  main { max-width:1080px; margin:0 auto; padding:24px; }
  h1 { font-size:20px; margin:0 0 4px; letter-spacing:-.01em; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.06em;
       color:var(--muted); margin:28px 0 10px; }
  table { border-collapse:collapse; width:100%; background:#fff; }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line);
           font-size:14px; vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase;
       letter-spacing:.05em; }
  td a { color:#0b5cad; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:6px; padding:16px; }
  .columns { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  @media (max-width:860px) { .columns { grid-template-columns:1fr; } }
  pre.source { margin:0; white-space:pre-wrap; font:13px/1.6 ui-monospace, SFMono-Regular,
               Menlo, monospace; }
  mark { background:var(--mark); padding:1px 0; border-bottom:2px solid #e3c44d; }
  .status { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px;
            font-weight:600; border:1px solid var(--line); background:#fff; }
  .pass, .validated, .written { color:var(--pass); border-color:currentColor; }
  .needs_review, .approved { color:var(--review); border-color:currentColor; }
  .fail, .extraction_failed { color:var(--fail); border-color:currentColor; }
  .muted { color:var(--muted); }
  .hash { font:12px ui-monospace, monospace; color:var(--muted); }
  form { display:inline; }
  button { font:inherit; font-weight:600; padding:8px 14px; border-radius:6px;
           border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; }
  button.secondary { background:#fff; color:var(--ink); }
  button[disabled] { opacity:.4; cursor:not-allowed; }
  .notice { border-left:3px solid var(--review); padding:8px 12px; background:#fffbeb;
            margin:12px 0; font-size:14px; }
  .actions { margin-top:16px; display:flex; gap:10px; align-items:center; }
  ul.evidence { list-style:none; margin:0; padding:0; }
  ul.evidence li { padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; }
  ul.evidence .field { font-weight:600; }
  ul.evidence .quote { font:12px ui-monospace, monospace; color:var(--muted);
                       display:block; margin-top:2px; }
</style>
</head>
<body>
<header><a href="/review">EvidenceFlow</a><span>review workbench &middot; synthetic data only</span></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
