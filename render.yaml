# Free deployment: one web service, no database service, no credit card.
#
# The container keeps its state in SQLite on the instance's disk. That disk does
# not survive a restart or a deploy on the free plan, so the demo reseeds its
# thirty synthetic documents whenever it comes back up. Everything is synthetic,
# so nothing is lost that matters.
#
# For state that survives restarts, add a hosted PostgreSQL connection string as
# EVIDENCEFLOW_DATABASE_URL in the service's environment. Migrations run on the
# way up either way.
services:
  - type: web
    name: evidenceflow
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    dockerCommand: ./scripts/start.sh
    envVars:
      - key: EVIDENCEFLOW_PROVIDER
        value: fake
      - key: EVIDENCEFLOW_RUN_WORKER
        value: "true"
      - key: EVIDENCEFLOW_SEED_ON_START
        value: "true"
      - key: EVIDENCEFLOW_AUTO_CREATE_SCHEMA
        value: "false"
      - key: EVIDENCEFLOW_FIXTURE_DIR
        value: /app/tests/fixtures
      - key: EVIDENCEFLOW_RATE_LIMIT_PER_MINUTE
        value: "60"
